[package]
name = "oxiserve"
version = "0.2.11"
edition = "2021"
rust-version = "1.80"
description = "A high-performance, nginx-config-compatible web server written in Rust"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "signal", "macros", "sync"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
core_affinity = "0.8"

httparse = "1.9"
httpdate = "1.0"
bytes = "1"
memchr = "2"

regex = "1"
glob = "0.3"
memmap2 = "0.9"
flate2 = "1"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"

[dev-dependencies]
# Backdating file timestamps so cache-manager age rules can be tested
# without the suite sleeping.
filetime = "0.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench-max]
inherits = "release"
debug = 1
strip = false
