# OxiServe sample configuration — ordinary nginx syntax.

worker_processes  auto;
error_log         logs/error.log  warn;

events {
    worker_connections  4096;
}

http {
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  logs/access.log  main  buffer=64k  flush=1s;

    sendfile      on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens on;

    gzip              on;
    gzip_min_length   256;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript text/xml;

    map $http_user_agent $is_bot {
        default        0;
        "~*bot|crawl"  1;
    }

    upstream backend {
        least_conn;
        server 127.0.0.1:9001 weight=2;
        server 127.0.0.1:9002 backup;
        keepalive 32;
    }

    server {
        listen       8080 default_server reuseport;
        server_name  localhost oxiserve.local *.oxiserve.local;
        root         html;
        index        index.html index.htm;

        add_header  X-Served-By  oxiserve  always;

        location = /healthz {
            return 200 "ok\n";
        }

        location /assets/ {
            expires    30d;
            autoindex  on;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|woff2)$ {
            expires     max;
            access_log  off;
        }

        location /app/ {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /old/ {
            rewrite ^/old/(.*)$ /new/$1 permanent;
        }

        error_page  404              /404.html;
        error_page  500 502 503 504  /50x.html;

        location = /50x.html {
            internal;
        }
    }
}
