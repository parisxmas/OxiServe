# A reverse proxy in front of one application, with a response cache.
#
#   oxiserve -t -c conf/examples/reverse-proxy.conf
#
# The shape almost every deployment starts with: TLS and static assets at the
# edge, an app server behind it, WebSockets passed through, and a cache that
# absorbs the repeated reads.

worker_processes  auto;
error_log         logs/error.log  warn;

events {
    worker_connections  8192;
}

http {
    default_type  application/octet-stream;
    access_log    logs/access.log;

    sendfile           on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # ---- the cache ---------------------------------------------------------
    # `keys_zone` sizes the index, `max_size` the bodies on disk. The cache
    # manager prunes in the background: past `inactive`, then oldest-first
    # down to `max_size`.
    #
    # The path is relative to the prefix so this file passes `oxiserve -t` as
    # an unprivileged user — the directory is created when the config loads,
    # exactly as nginx does it. In production this is usually an absolute
    # path such as /var/cache/oxiserve.
    proxy_cache_path  cache/app
                      levels=1:2
                      keys_zone=app_cache:100m
                      inactive=24h
                      max_size=10g;

    # `$http_upgrade` is empty for an ordinary request and "websocket" for an
    # upgrade, which is what makes one `proxy_set_header` line work for both.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    upstream app {
        server 127.0.0.1:3000;
        # Reusing upstream connections removes a TCP handshake per request.
        # The pool is per worker and each connection is probed for liveness
        # before it is handed out again.
        keepalive  32;
    }

    server {
        listen       80;
        server_name  app.example.com;
        return       301 https://$host$request_uri;
    }

    server {
        listen       443 ssl http2;
        listen       443 quic;
        server_name  app.example.com;

        ssl_certificate      /etc/ssl/app.example.com/fullchain.pem;
        ssl_certificate_key  /etc/ssl/app.example.com/privkey.pem;

        # Uploads pass through the proxy, so the limit belongs here as well as
        # in the application.
        client_max_body_size  50m;

        add_header  Strict-Transport-Security  "max-age=31536000"  always;

        # Static assets are served directly. Anything the edge can answer is a
        # request the application never sees.
        location /static/ {
            root        /var/www/app;
            expires     30d;
            access_log  off;
        }

        # ---- WebSockets ----------------------------------------------------
        # A `101` switches the connection out of HTTP and wires the two
        # sockets together. `proxy_read_timeout` becomes an *idle* timeout on
        # the tunnel rather than a bound on its life, so a socket that sits
        # quiet for an hour and then carries a message is fine.
        location /ws {
            proxy_pass          http://app;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade     $http_upgrade;
            proxy_set_header    Connection  $connection_upgrade;
            proxy_set_header    Host        $host;
            proxy_read_timeout  3600s;
        }

        # ---- cached reads --------------------------------------------------
        location /api/public/ {
            proxy_pass  http://app;
            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            proxy_cache            app_cache;
            proxy_cache_key        "$scheme$request_method$host$request_uri";
            proxy_cache_valid      200 301 302  10m;
            proxy_cache_valid      404          1m;
            proxy_cache_min_uses   2;

            # One request refreshes an expired entry and the rest wait for that
            # result, instead of every one of them opening its own upstream
            # connection the moment a popular key expires.
            proxy_cache_lock          on;
            proxy_cache_lock_timeout  5s;

            # `updating` answers waiters from the stale copy immediately rather
            # than queueing them behind the refresh at all.
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;

            # Lets a client force a miss, and keeps authenticated responses out
            # of a shared cache.
            proxy_cache_bypass  $http_cache_control;
            proxy_no_cache      $http_authorization;

            add_header  X-Cache-Status  $upstream_cache_status  always;
        }

        # ---- everything else, uncached --------------------------------------
        location / {
            proxy_pass  http://app;
            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # Do not leak the application's own server banner or its internal
            # routing headers to the client.
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;
        }

        error_page  502 503 504  /maintenance.html;

        location = /maintenance.html {
            root      /var/www/errors;
            internal;
        }
    }
}
