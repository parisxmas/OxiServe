# An API gateway: authentication, rate limits, and routing to services.
#
#   oxiserve -t -c conf/examples/api-gateway.conf
#
# The gateway holds no business logic. It decides who may pass, how fast they
# may go, and which service answers — everything else is somebody's upstream.

worker_processes  auto;
error_log         logs/error.log  warn;

events {
    worker_connections  16384;
}

http {
    default_type  application/json;

    log_format  gw  '$remote_addr [$time_local] "$request" $status '
                    'tier=$tier user=$auth_user upstream=$upstream_addr '
                    'ut=$upstream_response_time rt=$request_time';
    access_log  logs/access.log  gw  buffer=64k  flush=1s;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # ---- tiers -------------------------------------------------------------
    # An API key maps to a tier, and the tier picks which bucket the request
    # is charged against.
    map $http_x_api_key $tier {
        default                     anon;
        "~^pk_live_partner_"        partner;
        "~^pk_live_"                customer;
    }

    # The rate-limit key. An *empty* key is skipped entirely, which is how
    # internal callers are exempted without a second `location`.
    map $tier $limit_key {
        default    $binary_remote_addr;
        partner    "";
    }

    # ---- buckets -----------------------------------------------------------
    # Excess is tracked in milli-requests, so a fractional rate stays exact.
    limit_req_zone  $limit_key            zone=per_ip:10m   rate=20r/s;
    limit_req_zone  $http_x_api_key       zone=per_key:10m  rate=100r/s;
    limit_req_zone  $binary_remote_addr   zone=login:10m    rate=10r/m;

    # Concurrent requests in flight, not connections: an idle keep-alive
    # connection costs nothing here.
    limit_conn_zone  $binary_remote_addr  zone=conn_per_ip:10m;

    limit_req_status   429;
    limit_conn_status  429;

    # ---- services ----------------------------------------------------------
    upstream auth_service {
        server 10.0.1.10:8081;
        server 10.0.1.11:8081;
        keepalive     32;
        health_check  interval=5s fails=2 passes=2 uri=/healthz;
    }

    upstream users_service {
        least_conn;
        server 10.0.2.10:8080  max_fails=3 fail_timeout=30s;
        server 10.0.2.11:8080  max_fails=3 fail_timeout=30s;
        keepalive     64;
        health_check  interval=10s fails=3 passes=2 uri=/healthz;
    }

    upstream orders_service {
        least_conn;
        server 10.0.3.10:8080  max_fails=3 fail_timeout=30s;
        server 10.0.3.11:8080  max_fails=3 fail_timeout=30s;
        keepalive     64;
        health_check  interval=10s fails=3 passes=2 uri=/healthz;
    }

    upstream search_service {
        server 10.0.4.10:8080;
        keepalive  32;
    }

    server {
        listen       443 ssl http2;
        listen       443 quic;
        server_name  api.example.com;

        ssl_certificate      /etc/ssl/api.example.com/fullchain.pem;
        ssl_certificate_key  /etc/ssl/api.example.com/privkey.pem;

        add_header  Strict-Transport-Security  "max-age=31536000"  always;
        add_header  X-Content-Type-Options     nosniff  always;

        client_max_body_size  10m;

        # Every request costs one concurrent slot and one token, before any
        # work is done for it.
        limit_conn  conn_per_ip  50;
        limit_req   zone=per_ip  burst=40  nodelay;

        # ---- health, unauthenticated and unlimited -------------------------
        location = /healthz {
            access_log  off;
            return      200 "{\"status\":\"ok\"}\n";
        }

        # ---- the authorisation subrequest ----------------------------------
        # Reachable only from `auth_request`, never from a client.
        location = /_authz {
            internal;
            proxy_pass              http://auth_service/verify;
            proxy_http_version      1.1;
            # The service is being asked *about* the request, not asked to
            # process it, so the body is not forwarded.
            proxy_set_header        Content-Length  "";
            proxy_set_header        X-Original-URI  $request_uri;
            proxy_set_header        X-Api-Key       $http_x_api_key;
            proxy_set_header        X-Tier          $tier;
            proxy_connect_timeout   1s;
            proxy_read_timeout      2s;
        }

        # ---- login, deliberately slow --------------------------------------
        # A far tighter bucket than the rest of the API, because this is the
        # endpoint worth guessing at. No `nodelay`: requests inside the burst
        # are held rather than refused, which shapes a script to the rate
        # instead of handing it a fast error to retry against.
        location = /v1/auth/login {
            limit_req  zone=login  burst=5;

            # Only POST reaches the service. nginx needs the inner `deny all`
            # to enforce this; OxiServe enforces the method list on the
            # `limit_except` line itself and ignores the block, so the two
            # agree on the outcome and differ on the status — 403 on nginx,
            # 405 here. The block is kept so the file is portable.
            #
            # Note that `allow` / `deny` as *IP* access control is not
            # implemented; `oxiserve -t` reports them as unknown directives
            # wherever they appear outside a `limit_except` block.
            limit_except POST {
                deny all;
            }
            proxy_pass        http://auth_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        # ---- authenticated routes -------------------------------------------
        location /v1/users/ {
            auth_request      /_authz;
            # Carry the identity the auth service resolved into the upstream
            # request, so the service behind us does not repeat the lookup.
            auth_request_set  $auth_user  $upstream_http_x_user_id;
            auth_request_set  $auth_scope $upstream_http_x_scope;

            limit_req  zone=per_key  burst=200  nodelay;

            proxy_pass        http://users_service;
            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-User-Id          $auth_user;
            proxy_set_header  X-Scope            $auth_scope;
            # The client does not get to set these.
            proxy_set_header  X-Api-Key          "";

            proxy_next_upstream        error timeout http_502 http_503;
            proxy_next_upstream_tries  2;
            proxy_connect_timeout      2s;
            proxy_read_timeout         30s;
        }

        location /v1/orders/ {
            auth_request      /_authz;
            auth_request_set  $auth_user  $upstream_http_x_user_id;

            limit_req  zone=per_key  burst=100  nodelay;

            proxy_pass        http://orders_service;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-User-Id        $auth_user;

            # Orders are written here, so a retry could double-charge someone.
            # `error timeout` alone still retries a connection that never
            # opened, which is the case where nothing can have happened yet.
            proxy_next_upstream        error timeout;
            proxy_next_upstream_tries  2;
            proxy_read_timeout         60s;
        }

        # ---- public, cached, no auth ----------------------------------------
        location /v1/search {
            limit_req  zone=per_ip  burst=20  nodelay;
            proxy_pass        http://search_service;
            proxy_set_header  Host  $host;
            proxy_read_timeout  10s;
        }

        # ---- CORS preflight --------------------------------------------------
        # Answered at the edge: a preflight carries no credentials and no body,
        # so there is nothing for a service to decide.
        location /v1/ {
            if ($request_method = OPTIONS) {
                add_header  Access-Control-Allow-Origin   "https://app.example.com"  always;
                add_header  Access-Control-Allow-Methods  "GET, POST, PUT, PATCH, DELETE, OPTIONS"  always;
                add_header  Access-Control-Allow-Headers  "Authorization, Content-Type, X-Api-Key"  always;
                add_header  Access-Control-Max-Age        86400  always;
                return 204;
            }
            return 404 "{\"error\":\"unknown endpoint\"}\n";
        }

        location / {
            return 404 "{\"error\":\"unknown endpoint\"}\n";
        }

        # ---- errors as JSON --------------------------------------------------
        # A gateway that answers HTML to an API client is a parse error at the
        # other end.
        error_page  401  = @err401;
        error_page  403  = @err403;
        error_page  413  = @err413;
        error_page  429  = @err429;
        # 500 has to be in this list. An `auth_request` whose service is
        # unreachable fails closed as a 500 — which is the correct verdict,
        # and is also the single most likely error this gateway will ever
        # emit. Leaving it out means the one response you most want to be
        # JSON is the default HTML page.
        error_page  500  = @err500;
        error_page  502 503 504  = @err502;

        location @err401 { return 401 "{\"error\":\"unauthorized\"}\n"; }
        location @err403 { return 403 "{\"error\":\"forbidden\"}\n"; }
        location @err413 { return 413 "{\"error\":\"payload too large\"}\n"; }
        location @err429 { return 429 "{\"error\":\"rate limited\"}\n"; }
        location @err500 { return 500 "{\"error\":\"internal error\"}\n"; }
        location @err502 { return 502 "{\"error\":\"upstream unavailable\"}\n"; }
    }
}
