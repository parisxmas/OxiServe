# Load balancing across a pool, at layer 7 and layer 4.
#
#   oxiserve -t -c conf/examples/load-balancer.conf
#
# Covers the parts that decide whether a pool actually survives a backend
# going away: health checks in both directions, retrying a failed peer against
# another one, and a `backup` tier that only takes traffic when it has to.

worker_processes  auto;
error_log         logs/error.log  warn;

events {
    worker_connections  16384;
}

http {
    default_type  application/octet-stream;

    log_format  lb  '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr ut=$upstream_response_time rt=$request_time';
    access_log  logs/access.log  lb  buffer=64k  flush=1s;

    sendfile           on;
    keepalive_timeout  65;

    # ---- weighted round-robin, the default ---------------------------------
    upstream web {
        # Weight is relative: the 8-core box takes twice the share of the
        # 4-core one.
        server 10.0.1.10:8080  weight=2;
        server 10.0.1.11:8080  weight=1;

        # Only used when every primary above is down.
        server 10.0.1.99:8080  backup;

        # Drained for maintenance without editing it out of the pool.
        server 10.0.1.12:8080  down;

        keepalive  64;

        # Passive health: eject after 3 failures inside 30s, then let it back
        # in to try again. Costs nothing when everything is healthy, because
        # it only counts requests that were happening anyway.
        # (max_fails / fail_timeout are set per server below in `api`.)

        # Active health: probe whether or not traffic is flowing, so a backend
        # that comes back is known before a user finds out. Hysteresis in both
        # directions — one bad response does not eject, one good one does not
        # restore.
        health_check  interval=5s fails=3 passes=2 uri=/healthz status=200;
    }

    # ---- least_conn, for uneven request costs ------------------------------
    upstream api {
        # Real in-flight counts, weight-aware. Right when some requests are
        # far more expensive than others and round-robin would pile up behind
        # the slow ones.
        least_conn;

        server 10.0.2.10:9000  max_fails=3 fail_timeout=30s;
        server 10.0.2.11:9000  max_fails=3 fail_timeout=30s;
        server 10.0.2.12:9000  max_fails=3 fail_timeout=30s;

        keepalive  64;
        health_check  interval=10s fails=2 passes=2 uri=/api/healthz;
    }

    # ---- ip_hash, for stickiness -------------------------------------------
    upstream legacy {
        # Same client to the same backend, for an application holding session
        # state in memory. Note this is stickiness by *address*: a client
        # behind a rotating NAT will still move.
        ip_hash;
        server 10.0.3.10:8000;
        server 10.0.3.11:8000;
    }

    server {
        listen       80;
        server_name  _;
        return       301 https://$host$request_uri;
    }

    server {
        listen       443 ssl http2;
        listen       443 quic;
        server_name  www.example.com;

        ssl_certificate      /etc/ssl/example.com/fullchain.pem;
        ssl_certificate_key  /etc/ssl/example.com/privkey.pem;

        location = /healthz {
            access_log  off;
            return      200 "ok\n";
        }

        location /api/ {
            proxy_pass  http://api;
            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            # Retry another peer when this one fails. `non_idempotent` is
            # deliberately absent: a POST that timed out may well have been
            # processed, and replaying it is worse than returning the error.
            proxy_next_upstream          error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries    3;
            proxy_next_upstream_timeout  10s;

            proxy_connect_timeout  2s;
            proxy_read_timeout     30s;
        }

        location /legacy/ {
            proxy_pass        http://legacy;
            proxy_set_header  Host  $host;
        }

        location / {
            proxy_pass        http://web;
            proxy_set_header  Host               $host;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            proxy_next_upstream        error timeout;
            proxy_next_upstream_tries  2;
        }
    }
}

# ---- layer 4 ---------------------------------------------------------------
# TCP with no HTTP parsing at all, for protocols that are not HTTP. Shares
# upstream selection and passive health with the proxy above.
stream {
    upstream postgres_read {
        least_conn;
        server 10.0.4.10:5432  max_fails=2 fail_timeout=10s;
        server 10.0.4.11:5432  max_fails=2 fail_timeout=10s;
    }

    server {
        listen  5432;
        proxy_pass  postgres_read;
        proxy_connect_timeout  3s;
        # An *idle* timeout, not a cap on session length, so a long-lived
        # connection is never severed just for being long-lived.
        proxy_timeout  30m;
    }

    # Route TLS by SNI without terminating it: the ClientHello is inspected
    # and forwarded byte for byte, so the backend completes the handshake
    # against untouched input and no key or certificate lives here.
    map $ssl_preread_server_name $sni_backend {
        api.example.com  api_tls;
        git.example.com  git_tls;
        default          web_tls;
    }

    upstream api_tls { server 10.0.5.10:443; }
    upstream git_tls { server 10.0.5.11:443; }
    upstream web_tls { server 10.0.5.12:443; }

    server {
        listen       8443;
        ssl_preread  on;
        proxy_pass   $sni_backend;
    }
}
