# A public site on HTTPS, with HTTP/2 and HTTP/3.
#
#   oxiserve -t -c conf/examples/ssl-site.conf
#
# Serves static files for one domain, redirects cleartext to TLS, and offers
# h2 over TCP and h3 over QUIC on the same port. Swap the certificate paths
# and `server_name`, and this is a working config.

worker_processes  auto;
error_log         logs/error.log  warn;
pid               logs/oxiserve.pid;

events {
    worker_connections  8192;
}

http {
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  logs/access.log  main  buffer=64k  flush=1s;

    sendfile           on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # A cache hit here serves a request with zero filesystem syscalls, which is
    # most of the difference on the static hot path. Worth setting on any site
    # whose file set is smaller than `max=`.
    open_file_cache          max=20000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip             on;
    gzip_min_length  256;
    gzip_comp_level  5;
    gzip_vary        on;
    gzip_types       text/plain text/css application/json application/javascript
                     application/xml image/svg+xml;

    # ---- cleartext: redirect, except for ACME -----------------------------
    server {
        listen       80;
        listen       [::]:80;
        server_name  example.com www.example.com;

        # Certificate renewal has to reach this over plain HTTP, so it is the
        # one path that must not be redirected.
        location /.well-known/acme-challenge/ {
            root  /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- TLS ---------------------------------------------------------------
    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;

        # HTTP/3. A separate UDP socket on the same port; `ssl` is implied
        # because QUIC is always TLS 1.3. OxiServe adds the `Alt-Svc` header
        # to the TCP responses automatically, which is how a browser finds
        # this listener — set your own `add_header Alt-Svc` to override it.
        listen       443 quic;
        listen       [::]:443 quic;

        server_name  example.com www.example.com;

        ssl_certificate      /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;

        root   /var/www/example.com;
        index  index.html;

        # `always` so the header is present on error responses too, which is
        # exactly when a browser is most likely to be talking to something
        # that is not us.
        add_header  Strict-Transport-Security  "max-age=31536000; includeSubDomains"  always;
        add_header  X-Content-Type-Options     nosniff  always;
        add_header  X-Frame-Options            SAMEORIGIN  always;
        add_header  Referrer-Policy            strict-origin-when-cross-origin  always;

        client_max_body_size  16m;

        location = /healthz {
            access_log  off;
            return      200 "ok\n";
        }

        # Hashed asset filenames can be cached forever; the name changes when
        # the content does.
        location ~* \.(css|js|woff2|png|jpg|jpeg|gif|svg|ico)$ {
            expires     max;
            access_log  off;
            add_header  Cache-Control  "public, immutable"  always;
        }

        # Single-page app: real files win, everything else boots the shell.
        location / {
            try_files  $uri $uri/ /index.html;
        }

        error_page  404              /404.html;
        error_page  500 502 503 504  /50x.html;

        location = /50x.html {
            internal;
        }
    }

    # A default server so requests for an unknown Host are refused rather than
    # silently served by whichever block happens to be first.
    #
    # nginx configs usually write `return 444` here, which is its non-standard
    # "close without responding". OxiServe does not special-case 444 and would
    # send it as a literal status line, so this uses 421 Misdirected Request —
    # a real status that means the same thing to a client.
    server {
        listen       443 ssl default_server;
        server_name  _;
        ssl_certificate      /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/example.com/privkey.pem;
        return       421;
    }
}
